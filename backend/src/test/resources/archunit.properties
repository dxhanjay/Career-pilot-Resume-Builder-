# ---------------------------------------------------------------------------
# ArchUnit configuration
# ---------------------------------------------------------------------------

# By default ArchUnit fails any rule whose `that()` clause matches zero classes,
# on the reasoning that such a rule is probably a typo.
#
# That default is wrong for this project. The rules in ArchitectureTest are
# written BEFORE the code they govern, deliberately — so that the first
# controller written in Phase 3 is checked as it is written, rather than audited
# afterwards against a standard nobody remembers agreeing to. In Phase 2 there
# are no controllers, no entities, no services, and no domain classes, so eight
# of the eleven rules match nothing and the build would fail for the wrong
# reason.
#
# The risk this default protects against is real, though: a renamed base package
# would silently reduce every rule to a no-op while the build stayed green.
# ArchitectureTest#import_is_not_empty restores that floor by asserting the
# import found classes at all.
#
# NOTE: the key is `archRule.failOnEmptyShould`, not `failOnEmptyShould`. The
# unprefixed form is silently ignored — ArchUnit does not warn about unknown
# properties, so the only symptom is that the setting appears to do nothing.
archRule.failOnEmptyShould=false
