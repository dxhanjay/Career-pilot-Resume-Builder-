# ---------------------------------------------------------------------------
# Test profile
#
# Datasource properties are deliberately absent: @ServiceConnection on the
# Testcontainers PostgreSQL container supplies the URL, username, and password
# at runtime. Declaring them here as well would either be ignored or, worse,
# override the container and point the suite at something else.
# ---------------------------------------------------------------------------

spring:
  jpa:
    hibernate:
      # Same as every other environment. Flyway owns the schema in tests too —
      # letting Hibernate generate it here would mean the migrations are never
      # exercised, which is precisely the failure this suite should catch.
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    # Each run starts from an empty container, so there is nothing to baseline.
    baseline-on-migrate: false

  mail:
    # Points at a port with nothing listening. Deliberate: mail sending is
    # @Async and swallows MailException, so tests exercise the real failure path
    # (send attempted, delivery fails, application continues) without needing a
    # mail server. A test that depended on SMTP would be slow and flaky.
    host: localhost
    port: 3025

app:
  cors:
    allowed-origins: http://localhost:5173
  async:
    core-pool-size: 1
    max-pool-size: 2
    queue-capacity: 10

  jwt:
    # Fixed test secret. Over 32 characters so JwtProperties' validation passes.
    # This value is worthless outside the test suite and is never used to sign
    # anything a real client will see.
    secret: test-only-signing-secret-that-is-long-enough-for-hs256
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: careerpilot-ai

  auth:
    # Off by default in tests so that integration tests can log in immediately
    # after registering. The enforced path has its own dedicated test that
    # overrides this property.
    require-email-verification: false
    max-failed-login-attempts: 5
    lockout-duration: 15m
    verification-token-ttl: 24h
    password-reset-token-ttl: 1h
    frontend-base-url: http://localhost:5173

  mail:
    from: no-reply@test.local

  storage:
    # The reason the FileStorage port exists. With only a Cloudinary adapter,
    # every upload test would need an account and an API key in CI - so they
    # would not exist, and the upload path would be the least-tested code in the
    # application while handling the least-trusted input.
    provider: local
    # Blank means java.io.tmpdir, which the OS clears. Tests must not accumulate
    # files in the working tree.
    local-directory: ""
    signed-url-ttl-seconds: 300

  resume:
    max-file-size-bytes: 5242880
    max-resumes-per-user: 10
    purge-after-days: 30

logging:
  level:
    root: WARN
    com.careerpilot: INFO
    # Testcontainers is chatty at INFO — image pulls, port mappings, wait
    # strategies — and drowns the output that matters when a test fails.
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.flywaydb: INFO
