# ---------------------------------------------------------------------------
# CareerPilot AI — shared configuration
#
# This file is committed. It therefore contains NO secrets. Every sensitive or
# environment-specific value is an ${ENV_VAR} reference, and the contract for
# what those variables are lives in .env.example.
#
# Profile-specific overrides: application-dev.yml, application-prod.yml
# ---------------------------------------------------------------------------

spring:
  application:
    name: careerpilot-api
    version: 0.1.0

  profiles:
    # Defaults to dev so that a fresh clone runs without ceremony. Production
    # sets SPRING_PROFILES_ACTIVE=prod explicitly — an environment that forgets
    # to should fail loudly rather than quietly running with dev settings.
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Must be a JDBC URL (jdbc:postgresql://...), never the libpq URL that
    # managed Postgres add-ons expose as DATABASE_URL. Handing that to Spring
    # produces "Driver claims to not accept jdbcUrl", which reads like a driver
    # problem and is a URL-format problem.
    #
    # Composed from parts when SPRING_DATASOURCE_URL is not given, because
    # that is what platforms actually hand you: Render exposes host, port and
    # database as separate values, and building the URL here avoids a shell
    # wrapper whose only job is string concatenation.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      # Keep the pool well below the database's max_connections. A container
      # that claims every available connection leaves nothing for migrations, a
      # psql session, or the second instance that exists briefly during a
      # rolling deploy.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

      # Fail fast when the pool is exhausted rather than piling up threads that
      # each wait 30 seconds. A request that cannot get a connection in 20s is
      # not going to succeed usefully.
      connection-timeout: 20000
      idle-timeout: 300000

      # Must be shorter than any idle-connection timeout imposed by the database
      # or an intermediate proxy. A connection the pool believes is alive and
      # the far end has already closed produces intermittent, unreproducible
      # "connection reset" errors.
      max-lifetime: 1200000

  jpa:
    hibernate:
      # 'validate', never 'update' — in every environment including local.
      #
      # 'update' lets Hibernate silently alter the production schema based on
      # entity annotations. It cannot drop columns, cannot rename safely, has no
      # review step, and no rollback. Flyway owns the schema; Hibernate's only
      # job here is to verify at startup that the entities and the schema agree.
      # A mismatch then fails on boot, where it is obvious, rather than on the
      # first query that touches the missing column.
      ddl-auto: validate

    # Disabled deliberately.
    #
    # open-in-view keeps a Hibernate session open for the whole request,
    # including view rendering. It makes LazyInitializationException disappear —
    # by silently issuing extra queries from the serialisation layer, which is
    # how N+1 problems become invisible until production. With it off, a lazy
    # access outside a transaction fails immediately and loudly, at the point
    # the fetch strategy is actually wrong.
    open-in-view: false

    properties:
      hibernate:
        jdbc:
          # Matches the TIMESTAMPTZ decision in the database design.
          time_zone: UTC
          # Batch inserts/updates; meaningful once parsed-entity rows are
          # written in bulk in Phase 6.
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fails the startup if a previously-applied migration file has been edited.
    # Editing an applied migration is how two environments silently diverge.
    validate-on-migrate: true
    # Allows Flyway to adopt an existing non-empty database on first run.
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      # FR-RES-01: 5 MB per file. Enforced by the container before any
      # application code runs, so it cannot be forgotten in a controller.
      max-file-size: 5MB
      # Slightly larger to accommodate multipart overhead and form fields.
      max-request-size: 6MB

  jackson:
    # Serialise Instant as ISO-8601 rather than an epoch number.
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  lifecycle:
    # Upper bound on graceful shutdown. Must be comfortably below the platform's
    # own SIGKILL grace period, or the process is killed mid-drain and the
    # graceful shutdown achieves nothing.
    timeout-per-shutdown-phase: 25s

  mail:
    # Provider-agnostic SMTP. Any of Gmail, Resend, Brevo, SendGrid, Mailgun, or
    # SES works by changing these values alone.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # Bound every stage of the SMTP conversation. Without these, a
          # provider that accepts a connection and then stalls holds a pool
          # thread until the OS gives up, which can be minutes.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  # Railway injects PORT at runtime. Binding to a hardcoded 8080 means the
  # platform health check hits a port nothing is listening on, the container is
  # marked unhealthy, and it restarts forever with no useful error message.
  port: ${PORT:8080}

  # NFR-SEC-05: never return a stack trace or internal message to a client.
  # GlobalExceptionHandler produces the response; these settings ensure that
  # anything reaching Spring's own error handling is equally uninformative.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

  # Finish in-flight requests before the process exits. On a Railway redeploy
  # this is the difference between a user's upload completing and it failing
  # with a connection reset.
  shutdown: graceful

  # Railway terminates TLS at its edge and forwards over HTTP. Without this the
  # application believes every request is plaintext, and any generated absolute
  # URL comes out as http:// — which a browser on an https:// page will refuse
  # as mixed content.
  forward-headers-strategy: framework

  tomcat:
    # Bound the request line and headers. Defaults are generous, and an
    # unbounded header is a cheap denial-of-service vector.
    max-http-form-post-size: 6MB
    max-swallow-size: 6MB

management:
  endpoints:
    web:
      exposure:
        # Only what is needed. Actuator exposes a great deal by default in some
        # configurations — /env and /configprops in particular will happily
        # print configuration values. Metrics is added for ADMIN use in Phase 13.
        include: health,info
  endpoint:
    health:
      # Enables /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

# ---------------------------------------------------------------------------
# Application-specific configuration. Bound to typed @ConfigurationProperties
# records under com.careerpilot.config.properties, so a typo here fails at
# startup rather than injecting a null that breaks later.
# ---------------------------------------------------------------------------
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:50}

  jwt:
    # No default. A missing JWT_SECRET must stop the application, not fall back
    # to something predictable: a known signing key lets anyone mint a token
    # claiming ROLE_ADMIN. JwtProperties additionally rejects anything under
    # 32 characters at startup.
    secret: ${JWT_SECRET}
    # NFR-SEC-03. Short by design: the access token is the credential that
    # cannot be revoked, so its lifetime IS the revocation delay.
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    issuer: careerpilot-ai

  auth:
    # See AuthProperties: enforcing verification protects deliverability and
    # blocks throwaway signups, at the cost of activation. Config, not code.
    require-email-verification: ${AUTH_REQUIRE_EMAIL_VERIFICATION:true}
    max-failed-login-attempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
    lockout-duration: ${AUTH_LOCKOUT_DURATION:15m}
    verification-token-ttl: ${AUTH_VERIFICATION_TOKEN_TTL:24h}
    # Much shorter than verification: this token grants account takeover.
    password-reset-token-ttl: ${AUTH_PASSWORD_RESET_TOKEN_TTL:1h}
    # Used to build links in outbound email.
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}

  mail:
    from: ${MAIL_FROM:no-reply@careerpilot.ai}

  admin:
    # Comma-separated emails granted ROLE_ADMIN at startup. See AdminProperties
    # for why the first administrator comes from configuration rather than from
    # a seeded account or a first-to-register rule. Additive only: removing an
    # address here does not demote anyone.
    bootstrap-emails: ${APP_ADMIN_BOOTSTRAP_EMAILS:}

  storage:
    # 'local' or 'cloudinary'. Local writes to disk and is development-only:
    # Railway filesystems are ephemeral, so every redeploy would silently delete
    # every uploaded resume. application-prod.yml overrides this to cloudinary.
    provider: ${APP_STORAGE_PROVIDER:local}
    local-directory: ${APP_STORAGE_LOCAL_DIR:}
    # Short by design. A signed URL is a bearer credential for one file, and
    # URLs leak through history, referrers, and screenshots.
    signed-url-ttl-seconds: ${APP_STORAGE_SIGNED_URL_TTL:300}

  cloudinary:
    # Unset locally. CloudinaryConfig is only instantiated when the storage
    # provider is cloudinary, and it fails fast with a clear message if these
    # are missing at that point.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:careerpilot}

  jobs:
    # How often to look for queued work. fixedDelay, so a slow batch cannot
    # cause overlapping runs.
    poll-interval-ms: ${APP_JOBS_POLL_INTERVAL_MS:5000}
    reaper-interval-ms: ${APP_JOBS_REAPER_INTERVAL_MS:60000}
    # Claimed jobs run sequentially on the poller thread, so a large batch means
    # the last job waits for all the others. Concurrency comes from the executor
    # and from replicas, not from batch size.
    batch-size: ${APP_JOBS_BATCH_SIZE:3}
    # Must comfortably exceed the slowest plausible job, or the reaper requeues
    # work that is still running and it executes twice.
    stale-lock-timeout: ${APP_JOBS_STALE_LOCK_TIMEOUT:5m}
    retention-days: ${APP_JOBS_RETENTION_DAYS:90}

  resume:
    # FR-RES-01. Also enforced by spring.servlet.multipart.max-file-size above
    # (the container rejects before any application code runs) and by a CHECK
    # constraint on the column.
    max-file-size-bytes: ${APP_RESUME_MAX_FILE_SIZE:5242880}
    # A cost control as much as a product limit: every resume is a candidate for
    # parsing and AI analysis, both of which cost money.
    max-resumes-per-user: ${APP_RESUME_MAX_PER_USER:10}
    # NFR-PRIV-01 requires removal within 30 days.
    purge-after-days: ${APP_RESUME_PURGE_AFTER_DAYS:30}

logging:
  level:
    root: INFO
    com.careerpilot: INFO
